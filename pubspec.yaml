# Every Flutter project has one of these. It names your app, sets the Dart
# version it needs, and lists the packages you depend on.
# Add a package with: flutter pub add <name>
name: final_project
description: My 6ADET final project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  # Lets you preview the app inside a phone frame while you develop in a
  # browser. It is switched off automatically in a release build.
  device_preview: ^1.3.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Put images, fonts and sounds in assets/ and list them here, for example:
  # assets:
  #   - assets/images/

# path_provider_foundation 2.6.0+ switched to an FFI implementation that
# depends on package:objective_c and Dart's experimental native-assets
# feature. That feature currently fails to build on Windows when the user
# profile path contains a space (ours does: "philbert logatoc"). Pinning
# back to the last plugin-based release avoids the problem entirely.
# See: https://github.com/flutter/packages/pull/10517
dependency_overrides:
  path_provider_foundation: 2.4.4